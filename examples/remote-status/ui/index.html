<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主机状态</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;color:#273449;background:linear-gradient(135deg,#f4f8ff,#fff);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:18px;margin:0}small{color:#8796ab}#connection{font-size:11px;color:#42856b}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin:24px 0}.metric{border-top:1px solid #e1e9f2;padding-top:15px}.metric strong{display:block;font-size:22px;letter-spacing:-.6px;margin:7px 0;overflow-wrap:anywhere}footer{font-size:11px;color:#8796ab}@media(max-width:350px){body{padding:14px}h1{font-size:14px}main{gap:10px;margin:12px 0;grid-template-columns:1fr 1fr}.metric strong{font-size:16px}.optional{display:none}}</style>
<script src="yirang.js"></script><header><h1>服务主机</h1><span id="connection">等待状态</span></header><main><div class="metric"><small>名称</small><strong id="host">—</strong></div><div class="metric"><small>服务运行时间</small><strong id="uptime">—</strong></div><div class="metric optional"><small>系统</small><strong id="platform">—</strong></div><div class="metric optional"><small>架构</small><strong id="arch">—</strong></div></main><footer id="updated">尚未收到数据</footer>
<script>yirang.widget.watchState((state,connection)=>{document.querySelector('#connection').textContent=connection?.online===false?'离线 · 最近数据':'已连接';for(const key of ['host','platform','arch'])document.getElementById(key).textContent=state?.[key]||'—';document.querySelector('#uptime').textContent=Number.isFinite(state?.uptimeSeconds)?Math.floor(state.uptimeSeconds/60)+' 分钟':'—';document.querySelector('#updated').textContent=state?.updatedAt?'更新于 '+new Date(state.updatedAt).toLocaleString():'等待后端发布状态';});</script></html>
