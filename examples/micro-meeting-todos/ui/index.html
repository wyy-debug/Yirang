<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>会议纪要 → 待办</title>
<style>body{font:14px system-ui,sans-serif;margin:16px}textarea{width:100%;height:120px}table{border-collapse:collapse;width:100%;margin-top:8px}td,th{border:1px solid #ccc;padding:4px}.muted{color:#666}</style></head>
<body>
<h2>会议纪要 → 待办</h2>
<label>会议名称 <input id="meeting"></label>
<p><button id="pick">选择纪要材料</button> <span id="picked" class="muted">未选择</span></p>
<label>补充说明<textarea id="note" placeholder="可留空"></textarea></label>
<p><button id="run">整理待办</button> <span id="status" class="muted"></span></p>
<table id="table" hidden><thead><tr><th>事项</th><th>负责人</th><th>截止</th><th>优先级</th></tr></thead><tbody></tbody></table>
<p id="actions" hidden><button id="example">设为样例</button> <button id="wrong">结果不对</button></p>
<script>
let materials=[],runId=null;const $=id=>document.getElementById(id);
$('pick').onclick=async()=>{const r=await yirang.materials.pick();materials=(r?.objects||[]).map(o=>o.id).filter(Boolean);$('picked').textContent=materials.length?materials.length+' 份材料':'未选择';};
$('run').onclick=async()=>{
  $('status').textContent='提交中…';$('table').hidden=true;$('actions').hidden=true;
  try{
    const run=await yirang.ai.run('extract',{meeting:$('meeting').value||'会议',note:$('note').value||null},{materials});runId=run.id;
    const done=await yirang.wait(run.id);
    if(done.state!=='completed'){$('status').textContent='失败：'+(done.error||done.state);return;}
    const body=$('table').tBodies[0];body.textContent='';
    for(const t of done.result.todos){const tr=body.insertRow();for(const v of [t.task,t.owner??'',t.due??'',t.priority])tr.insertCell().textContent=v;}
    $('table').hidden=false;$('actions').hidden=false;$('status').textContent=done.result.summary;
  }catch(e){$('status').textContent=e.message;}
};
$('example').onclick=()=>yirang.examples.propose(runId).then(r=>$('status').textContent=r.status==='user-confirmed'?'已保存为样例':'未保存').catch(e=>$('status').textContent=e.message);
$('wrong').onclick=()=>yirang.feedback(runId,{verdict:'wrong',note:prompt('哪里不对？')||''}).then(()=>$('status').textContent='已记录');
</script>
</body>
</html>
