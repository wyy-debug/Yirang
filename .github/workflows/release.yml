name: Windows desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Install Windows installer compiler
        run: choco install innosetup --yes --no-progress
      - run: npm ci
      - run: npm run check
      - run: npm run package:electron -- --update-zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Desktop-Windows
          path: |
            release/installers/*-Setup-x64.exe
            release/installers/*-win32-x64.zip
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package version' }
          $assets = @(Get-ChildItem -Path 'release/installers/*' -File -Include '*-Setup-x64.exe','*-win32-x64.zip' | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 2) { throw 'Expected an installer and an update archive' }
          gh release create "$env:RELEASE_TAG" @assets --title "$env:RELEASE_TAG" --generate-notes
