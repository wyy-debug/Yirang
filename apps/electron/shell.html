<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-ui-text="一壤 · Yirang">一壤 · Yirang</title>
    <link rel="stylesheet" href="./design-tokens.css" />
    <link rel="stylesheet" href="../../dist/shell.css" />
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./workspace/project-navigation.css" />
    <link rel="stylesheet" href="./composer/permission-controls.css" />
    <link rel="stylesheet" href="./composer/file-chat.css" />
    <link rel="stylesheet" href="timing/execution-timing.css" />
    <link rel="stylesheet" href="composer/composer-layout.css" />
    <link rel="stylesheet" href="conversation/question-card.css" />
  </head>
  <body>
    <main class="app-shell chat-open">
      <section class="desk" aria-label="工作桌面" data-ui-aria-label="工作桌面">
        <iframe
          id="panel"
          title="工作桌面"
          data-ui-title="工作桌面"
          src="../../dist/panel-electron.html"
        ></iframe>
      </section>
      <section id="connection-failure" class="connection-failure" role="alert" hidden>
        <img
          src="../panel/assets/yirang.png"
          width="64"
          height="64"
          style="border-radius: 23%"
          alt="一壤"
        />
        <h1 data-ui-text="桌面暂未连接">桌面暂未连接</h1>
        <p data-ui-text="本地服务连接失败，详细原因已显示在对话中。">
          本地服务连接失败，详细原因已显示在对话中。
        </p>
        <button id="connection-retry" type="button" data-ui-text="重新连接">重新连接</button>
      </section>
      <button
        id="chat-toggle"
        class="chat-toggle"
        type="button"
        aria-label="展开 Codex 对话"
        data-ui-aria-label="展开 Codex 对话"
        aria-expanded="true"
        aria-controls="chat"
        title="展开 Codex 对话"
        data-ui-title="展开 Codex 对话"
        hidden
      >
        <span class="codex-mark" aria-hidden="true"
          ><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-12-2 16" /></svg></span
        ><span>Codex</span><span class="toggle-indicator" aria-hidden="true"></span>
      </button>
      <section
        id="chat"
        class="chat is-empty"
        aria-label="Codex 对话"
        data-ui-aria-label="Codex 对话"
      >
        <div
          id="chat-resize"
          class="chat-resize"
          role="separator"
          tabindex="0"
          aria-label="调整对话栏宽度"
          data-ui-aria-label="调整对话栏宽度"
          aria-orientation="vertical"
          aria-valuemin="320"
          aria-valuemax="560"
          aria-valuenow="400"
          title="拖动调整宽度 · 双击恢复默认"
          data-ui-title="拖动调整宽度 · 双击恢复默认"
        ></div>
        <div class="chat-surface">
          <div class="chat-header">
            <span class="codex-mark header-mark" aria-hidden="true"
              ><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-12-2 16" /></svg
            ></span>
            <div class="chat-heading">
              <strong>Codex</strong>
              <div class="connection-state">
                <span class="connection-dot" aria-hidden="true"></span
                ><small id="connection-label">正在连接桌面</small>
              </div>
            </div>
            <div class="file-chat-heading">
              <strong id="file-chat-title"></strong
              ><button
                id="file-chat-history"
                type="button"
                aria-expanded="false"
                aria-controls="messages"
                data-ui-text="查看记录"
              >
                查看记录
              </button>
            </div>
            <div class="chat-actions">
              <button
                id="file-chat-dock"
                type="button"
                title="展开为侧边对话"
                data-ui-title="展开为侧边对话"
                aria-label="展开为侧边对话"
                data-ui-aria-label="展开为侧边对话"
              >
                <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M10 4H4v16h16v-6" /></svg>
              </button>
              <button
                id="thread"
                type="button"
                title="切换对话"
                data-ui-title="切换对话"
                aria-label="切换对话"
                data-ui-aria-label="切换对话"
              >
                <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h12M4 17h8" /></svg>
              </button>
              <button
                id="reconnect"
                type="button"
                title="重新连接本机 Codex CLI"
                data-ui-title="重新连接本机 Codex CLI"
                aria-label="重新连接"
                data-ui-aria-label="重新连接"
              >
                <svg viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6" /></svg>
              </button>
              <button
                id="chat-close"
                type="button"
                title="收起对话"
                data-ui-title="收起对话"
                aria-label="收起对话"
                data-ui-aria-label="收起对话"
              >
                <svg class="sidebar-close-icon" viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="16" rx="3" />
                  <path d="M15 4v16m-6-11 3 3-3 3" /></svg
                ><svg class="file-close-icon" viewBox="0 0 24 24">
                  <path d="m6 6 12 12M18 6 6 18" />
                </svg>
              </button>
            </div>
            <div id="thread-list" class="thread-list" hidden></div>
          </div>
          <div class="chat-body">
            <div id="chat-intro" class="chat-intro">
              <h1 data-ui-text="有什么想做的？">有什么想做的？</h1>
              <p id="file-ai-shortcut-hint">Ctrl+Alt+A · 点击文件提问</p>
            </div>
            <div
              id="messages"
              class="messages"
              role="log"
              aria-label="对话消息"
              data-ui-aria-label="对话消息"
              aria-live="polite"
            >
              <div
                id="initial-connection-message"
                class="message system"
                data-ui-text="正在连接本机 Codex CLI…"
              >
                正在连接本机 Codex CLI…
              </div>
            </div>
            <button
              id="latest-message"
              class="latest-message"
              type="button"
              hidden
              data-ui-text="↓ 回到最新消息"
            >
              ↓ 回到最新消息
            </button>
          </div>
          <div id="chat-progress" class="chat-progress" hidden>
            <span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span
            ><span id="progress-label">正在处理</span><span id="progress-time"></span>
          </div>
          <div class="compose">
            <div class="composer">
              <div id="selection" class="selection" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 12 5-5a3 3 0 0 1 4 4l-7 7a5 5 0 0 1-7-7l8-8" /></svg
                ><span id="selection-label">已引用桌面材料</span
                ><button
                  id="selection-clear"
                  type="button"
                  title="移除材料引用"
                  data-ui-title="移除材料引用"
                  aria-label="移除材料引用"
                  data-ui-aria-label="移除材料引用"
                >
                  ×
                </button>
              </div>
              <textarea
                id="input"
                rows="3"
                aria-label="向 AI 提问"
                data-ui-aria-label="向 AI 提问"
                title="Enter 发送，Shift + Enter 换行"
                data-ui-title="Enter 发送，Shift + Enter 换行"
                placeholder="提问，或交办一件事…"
                data-ui-placeholder="提问，或交办一件事…"
              ></textarea>
              <div class="composer-tools">
                <span class="context-label"
                  ><svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="13" rx="3" />
                    <path d="M9 21h6m-3-4v4" /></svg
                  >当前桌面</span
                ><span
                  class="send-hint"
                  title="Enter 发送，Shift + Enter 换行"
                  data-ui-title="Enter 发送，Shift + Enter 换行"
                  >Enter ↵</span
                ><button
                  id="stop"
                  class="stop-button"
                  type="button"
                  disabled
                  title="停止当前回合"
                  data-ui-title="停止当前回合"
                  aria-label="停止当前回合"
                  data-ui-aria-label="停止当前回合"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="6" y="6" width="12" height="12" rx="3" />
                  </svg></button
                ><button
                  id="send"
                  class="send-button"
                  type="button"
                  disabled
                  title="发送消息"
                  data-ui-title="发送消息"
                  aria-label="发送消息"
                  data-ui-aria-label="发送消息"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 19V5m-5 5 5-5 5 5" />
                  </svg>
                </button>
              </div>
            </div>
            <div id="status" class="status" role="status"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="../../dist/shell.js"></script>
  </body>
</html>
